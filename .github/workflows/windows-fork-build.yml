name: Windows Fork Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/desktop-app-launch

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Apply fork customizations
        run: python scripts/apply_fork_customizations.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Build Windows bundles
        run: npm run tauri build

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-desktop-app-launch
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/ScrcpyGUI.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
