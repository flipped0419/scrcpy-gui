name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/harmony-preview
  pull_request:

permissions:
  contents: write

env:
  PREVIEW_TAG: v4.1.0-harmony.1

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = "C:\\Android\\android-sdk" }
          $sdkmanager = Get-ChildItem (Join-Path $sdkRoot "cmdline-tools") -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $sdkmanager) { throw "sdkmanager.bat not found under $sdkRoot" }
          & $sdkmanager.FullName "platforms;android-36" "build-tools;36.0.0"

      - name: Build HarmonyOS scrcpy server
        shell: pwsh
        run: .\scripts\build_harmony_server.ps1

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Build Windows bundles
        run: npm run tauri build

      - name: Prepare release files
        shell: pwsh
        run: |
          Copy-Item src-tauri/resources/scrcpy-server-harmony src-tauri/target/release/scrcpy-server-harmony

          $portable = "ScrcpyGUI-$env:PREVIEW_TAG-portable.zip"
          Compress-Archive -Force -Path src-tauri/target/release/ScrcpyGUI.exe,src-tauri/target/release/scrcpy-server-harmony -DestinationPath $portable

          $files = @($portable)
          $files += Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName
          $files += Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object FullName

          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-HarmonyOS-Preview
          if-no-files-found: error
          retention-days: 30
          path: |
            ScrcpyGUI-${{ env.PREVIEW_TAG }}-portable.zip
            SHA256SUMS.txt
            src-tauri/target/release/ScrcpyGUI.exe
            src-tauri/target/release/scrcpy-server-harmony
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish HarmonyOS preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/harmony-preview'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:PREVIEW_TAG

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving the existing prerelease unchanged."
            exit 0
          }

          @"
          ## ScrcpyGUI HarmonyOS PC Mode Preview

          First organized preview build of the HarmonyOS PC Mode fork.

          ### Included
          - Native HarmonyOS/Huawei PC Mode through `CastPlusDisplay`
          - Separate stock and Harmony scrcpy-server paths
          - UHID mouse and keyboard in Harmony mode
          - Configurable scrcpy shortcut modifier for releasing mouse capture
          - Low-latency Harmony rendering without the ordinary 100 ms virtual-desktop buffer
          - Shared screen-off, audio, recording, fullscreen, always-on-top and other session settings
          - Lightweight Windows-style interface
          - Deduplicated advanced settings
          - Mouse-wheel and trackpad scrolling fixes
          - Repository source is now materialized directly instead of being generated by a chain of apply scripts during every build

          ### Compatibility
          Harmony-specific behavior has been tested on a Huawei/Honor device running HarmonyOS 4.2. It relies on internal platform behavior and may vary across devices and firmware versions.

          ### Files
          - NSIS installer: recommended for normal Windows installation
          - MSI installer: alternative Windows installer
          - portable ZIP: ScrcpyGUI executable plus the Harmony scrcpy server
          - SHA256SUMS.txt: checksums for release binaries

          Ordinary scrcpy may still be downloaded/configured by ScrcpyGUI as usual. This project is not an official Huawei/Honor integration.
          "@ | Set-Content -Encoding utf8 RELEASE_NOTES.md

          $assets = @(
            "ScrcpyGUI-$tag-portable.zip",
            "SHA256SUMS.txt"
          )
          $assets += Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName
          $assets += Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object FullName

          gh release create $tag @assets --target $env:GITHUB_SHA --title "ScrcpyGUI $tag" --notes-file RELEASE_NOTES.md --prerelease
