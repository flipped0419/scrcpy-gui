name: Build Harmony scrcpy server v2

on:
  push:
    branches:
      - harmony-ime-paste-test
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch scrcpy v4.1
        shell: bash
        run: |
          git clone --depth 1 --branch v4.1 https://github.com/Genymobile/scrcpy.git upstream-scrcpy
          git -C upstream-scrcpy rev-parse HEAD

      - name: Patch CastPlus display name and synchronous paste
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Huawei/HarmonyOS CastPlus virtual display name
          p = Path('upstream-scrcpy/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java')
          s = p.read_text(encoding='utf-8')
          old = 'createNewVirtualDisplay("scrcpy", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          new = 'createNewVirtualDisplay("CastPlusDisplay", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          if s.count(old) != 1:
              raise SystemExit('Unexpected CastPlus patch target count')
          p.write_text(s.replace(old, new), encoding='utf-8')

          # Avoid clipboard race when Windows IME commits multiple Unicode chunks.
          # The stock server injects KEYCODE_PASTE asynchronously; a following
          # SET_CLIPBOARD may overwrite the clipboard before the previous paste
          # event is consumed, causing e.g. “你好” -> “好好”.
          p = Path('upstream-scrcpy/server/src/main/java/com/genymobile/scrcpy/control/Controller.java')
          s = p.read_text(encoding='utf-8')
          old = 'pressReleaseKeycode(KeyEvent.KEYCODE_PASTE, Device.INJECT_MODE_ASYNC);'
          new = 'pressReleaseKeycode(KeyEvent.KEYCODE_PASTE, Device.INJECT_MODE_WAIT_FOR_FINISH);'
          if s.count(old) != 1:
              raise SystemExit(f'Unexpected paste patch target count: {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('Patched CastPlusDisplay and synchronous KEYCODE_PASTE')
          PY
          grep -n 'CastPlusDisplay' upstream-scrcpy/server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java
          grep -n 'KEYCODE_PASTE' upstream-scrcpy/server/src/main/java/com/genymobile/scrcpy/control/Controller.java

      - name: Build server
        shell: bash
        run: |
          cd upstream-scrcpy
          chmod +x gradlew
          ./gradlew -p server assembleRelease --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p out
          cp upstream-scrcpy/server/build/outputs/apk/release/server-release-unsigned.apk out/scrcpy-server-harmony-v4.1-v2
          sha256sum out/scrcpy-server-harmony-v4.1-v2 | tee out/SHA256SUMS.txt

      - name: Upload patched server
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server-harmony-v4.1-v2
          path: |
            out/scrcpy-server-harmony-v4.1-v2
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
