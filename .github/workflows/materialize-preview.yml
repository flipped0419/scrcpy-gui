name: Materialize Harmony Preview

on:
  push:
    branches:
      - release/harmony-preview
  workflow_dispatch:

permissions:
  contents: write

env:
  PREVIEW_TAG: v4.1.0-harmony.1

jobs:
  prepare-build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build HarmonyOS scrcpy server
        shell: pwsh
        run: |
          git clone --depth 1 --branch v4.1 https://github.com/Genymobile/scrcpy.git "$env:RUNNER_TEMP\harmony-scrcpy"

          $path = "$env:RUNNER_TEMP\harmony-scrcpy\server\src\main\java\com\genymobile\scrcpy\video\NewDisplayCapture.java"
          $content = Get-Content -Raw $path
          $old = 'createNewVirtualDisplay("scrcpy", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          $new = 'createNewVirtualDisplay("CastPlusDisplay", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          $count = ([regex]::Matches($content, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one virtual display patch target, found $count" }
          Set-Content -Path $path -Value ($content.Replace($old, $new)) -Encoding utf8 -NoNewline

          Push-Location "$env:RUNNER_TEMP\harmony-scrcpy"
          .\gradlew.bat -p server assembleRelease --stacktrace
          Pop-Location

          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item "$env:RUNNER_TEMP\harmony-scrcpy\server\build\outputs\apk\release\server-release-unsigned.apk" src-tauri/resources/scrcpy-server-harmony
          python -c "import zipfile; p='src-tauri/resources/scrcpy-server-harmony'; z=zipfile.ZipFile(p); d=z.read('classes.dex'); assert b'CastPlusDisplay' in d; print('Harmony server verified:', len(d), 'DEX bytes')"

      - name: Apply experimental customizations once
        shell: pwsh
        run: |
          python scripts/apply_fork_customizations.py
          python scripts/apply_app_picker_improvements.py
          python scripts/apply_app_names_orientation.py
          python scripts/apply_harmony_desktop.py
          python scripts/apply_harmony_latency_fix.py
          python scripts/apply_harmony_session_behavior.py
          python scripts/apply_light_ui.py
          python scripts/apply_light_ui_cleanup.py
          python scripts/apply_light_ui_fixes.py
          python scripts/apply_light_ui_dedup.py

      - name: Materialize final source tree
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/build_harmony_server.ps1 <<'PS1'
          $ErrorActionPreference = "Stop"

          $root = Resolve-Path (Join-Path $PSScriptRoot "..")
          $work = Join-Path $env:TEMP "scrcpy-harmony-server-v4.1"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }

          git clone --depth 1 --branch v4.1 https://github.com/Genymobile/scrcpy.git $work

          $path = Join-Path $work "server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java"
          $content = Get-Content -Raw $path
          $old = 'createNewVirtualDisplay("scrcpy", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          $new = 'createNewVirtualDisplay("CastPlusDisplay", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          $count = ([regex]::Matches($content, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one patch target, found $count" }
          Set-Content -Path $path -Value ($content.Replace($old, $new)) -Encoding utf8 -NoNewline

          Push-Location $work
          .\gradlew.bat -p server assembleRelease --stacktrace
          Pop-Location

          $outDir = Join-Path $root "src-tauri/resources"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          $out = Join-Path $outDir "scrcpy-server-harmony"
          Copy-Item (Join-Path $work "server/build/outputs/apk/release/server-release-unsigned.apk") $out -Force

          python -c "import zipfile; p=r'$out'; z=zipfile.ZipFile(p); d=z.read('classes.dex'); assert b'CastPlusDisplay' in d; print('Harmony server verified:', len(d), 'DEX bytes')"
          Get-FileHash $out -Algorithm SHA256
          PS1

          cat > .github/workflows/windows-fork-build.yml <<'YAML'
          name: Windows Build

          on:
            workflow_dispatch:
            push:
              branches:
                - main
                - release/harmony-preview
            pull_request:

          permissions:
            contents: read

          jobs:
            build-windows:
              runs-on: windows-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm

                - name: Install Rust
                  uses: dtolnay/rust-toolchain@stable

                - name: Rust cache
                  uses: swatinem/rust-cache@v2
                  with:
                    workspaces: src-tauri -> target

                - name: Setup Java 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Setup Android SDK
                  uses: android-actions/setup-android@v3

                - name: Install Android SDK 36
                  shell: pwsh
                  run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

                - name: Build HarmonyOS scrcpy server
                  shell: pwsh
                  run: .\scripts\build_harmony_server.ps1

                - name: Install dependencies
                  run: npm ci

                - name: TypeScript check
                  run: npm run lint

                - name: Frontend tests
                  run: npm test

                - name: Build Windows bundles
                  run: npm run tauri build

                - name: Prepare portable Harmony server
                  shell: pwsh
                  run: Copy-Item src-tauri/resources/scrcpy-server-harmony src-tauri/target/release/scrcpy-server-harmony

                - name: Upload Windows build
                  uses: actions/upload-artifact@v4
                  with:
                    name: ScrcpyGUI-Windows-HarmonyOS
                    if-no-files-found: error
                    retention-days: 14
                    path: |
                      src-tauri/target/release/ScrcpyGUI.exe
                      src-tauri/target/release/scrcpy-server-harmony
                      src-tauri/target/release/bundle/nsis/*.exe
                      src-tauri/target/release/bundle/msi/*.msi
          YAML

          cat >> README.md <<'MD'

          ---

          ## HarmonyOS PC Mode preview

          This fork includes an experimental HarmonyOS/Huawei PC Mode path based on a modified scrcpy v4.1 server.

          Key differences from ordinary scrcpy virtual display mode:

          - the virtual display is named `CastPlusDisplay`, allowing tested Huawei/HarmonyOS devices to hand the display to the native PC projection framework;
          - Harmony mode uses UHID keyboard and mouse input;
          - the scrcpy shortcut modifier used to release mouse capture is configurable;
          - Harmony mode reuses normal resolution, DPI, FPS, bitrate, codec, audio, recording, fullscreen and screen-off settings;
          - the extra 100 ms video buffer used by the ordinary virtual-desktop mode is intentionally disabled for Harmony mode;
          - ordinary scrcpy sessions continue to use the stock `scrcpy-server`; Harmony mode uses `scrcpy-server-harmony`.

          The modified server is **not committed as a binary**. Run `scripts/build_harmony_server.ps1` (or use the Windows CI workflow) to build it reproducibly from the official scrcpy v4.1 source.

          ### Tested scope

          The HarmonyOS-specific behavior is based on testing with a Huawei/Honor device running HarmonyOS 4.2. It relies on internal platform behavior and may differ across EMUI/HarmonyOS versions and devices. This is not an official Huawei/Honor integration.
          MD

          cat > CHANGELOG.md <<'MD'
          # Changelog

          ## v4.1.0-harmony.1 — Preview

          - Added experimental native HarmonyOS PC Mode through `CastPlusDisplay`.
          - Added separate stock and Harmony scrcpy-server selection.
          - Added UHID keyboard/mouse defaults for Harmony mode.
          - Added configurable scrcpy shortcut modifier for releasing UHID mouse capture.
          - Reused normal session behavior settings including screen-off, audio, recording, fullscreen and always-on-top.
          - Removed the ordinary virtual-desktop 100 ms video buffer from Harmony mode.
          - Added the lightweight Windows-style UI and deduplicated the advanced settings section.
          - Fixed main-content mouse-wheel/trackpad scrolling.
          - Materialized previously generated customizations into the repository source tree.
          MD

          printf '\n# Built during CI; do not commit the generated Harmony server\nsrc-tauri/resources/scrcpy-server-harmony\n' >> .gitignore

          rm -f scripts/apply_*.py
          rm -f .github/workflows/materialize-preview.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize HarmonyOS preview source [skip ci]"
          git push origin HEAD:release/harmony-preview

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Build Windows bundles
        run: npm run tauri build

      - name: Prepare release files
        shell: pwsh
        run: |
          Copy-Item src-tauri/resources/scrcpy-server-harmony src-tauri/target/release/scrcpy-server-harmony
          $portable = "ScrcpyGUI-$env:PREVIEW_TAG-portable.zip"
          Compress-Archive -Force -Path src-tauri/target/release/ScrcpyGUI.exe,src-tauri/target/release/scrcpy-server-harmony -DestinationPath $portable

          $files = @($portable)
          $files += Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName
          $files += Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object FullName

          $lines = foreach ($f in $files) {
            $h = Get-FileHash $f -Algorithm SHA256
            "$($h.Hash.ToLower())  $([IO.Path]::GetFileName($f))"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Create prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          ## ScrcpyGUI HarmonyOS PC Mode Preview

          This is the first organized preview build after materializing the previously CI-generated customizations into the repository source tree.

          Highlights:
          - HarmonyOS/Huawei native PC Mode through CastPlusDisplay
          - separate stock and Harmony scrcpy-server paths
          - low-latency Harmony rendering
          - UHID mouse and keyboard
          - configurable mouse-release shortcut modifier
          - shared screen-off, audio, recording, fullscreen and other session options
          - lightweight Windows-style UI
          - deduplicated advanced settings
          - fixed mouse-wheel / trackpad scrolling

          Tested on a Huawei/Honor HarmonyOS 4.2 device. Harmony-specific behavior is experimental and may vary by firmware/device.

          The installer can download ordinary scrcpy as usual. The Harmony server is bundled as an application resource.
          "@ | Set-Content -Encoding utf8 RELEASE_NOTES.md

          $assets = @(
            "ScrcpyGUI-$env:PREVIEW_TAG-portable.zip",
            "SHA256SUMS.txt"
          )
          $assets += Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName
          $assets += Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object FullName

          gh release create "$env:PREVIEW_TAG" @assets --target release/harmony-preview --title "ScrcpyGUI $env:PREVIEW_TAG" --notes-file RELEASE_NOTES.md --prerelease

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-${{ env.PREVIEW_TAG }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ScrcpyGUI-${{ env.PREVIEW_TAG }}-portable.zip
            SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
