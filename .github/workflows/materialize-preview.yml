name: Materialize Harmony Preview Source

on:
  push:
    branches:
      - release/harmony-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = "C:\\Android\\android-sdk" }
          $sdkmanager = Get-ChildItem (Join-Path $sdkRoot "cmdline-tools") -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $sdkmanager) { throw "sdkmanager.bat not found under $sdkRoot" }
          & $sdkmanager.FullName "platforms;android-36" "build-tools;36.0.0"

      - name: Build HarmonyOS scrcpy server
        shell: pwsh
        run: |
          git clone --depth 1 --branch v4.1 https://github.com/Genymobile/scrcpy.git "$env:RUNNER_TEMP\harmony-scrcpy"

          $path = "$env:RUNNER_TEMP\harmony-scrcpy\server\src\main\java\com\genymobile\scrcpy\video\NewDisplayCapture.java"
          $content = Get-Content -Raw $path
          $old = 'createNewVirtualDisplay("scrcpy", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          $new = 'createNewVirtualDisplay("CastPlusDisplay", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          $count = ([regex]::Matches($content, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one virtual display patch target, found $count" }
          Set-Content -Path $path -Value ($content.Replace($old, $new)) -Encoding utf8 -NoNewline

          Push-Location "$env:RUNNER_TEMP\harmony-scrcpy"
          .\gradlew.bat -p server assembleRelease --stacktrace
          Pop-Location

          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item "$env:RUNNER_TEMP\harmony-scrcpy\server\build\outputs\apk\release\server-release-unsigned.apk" src-tauri/resources/scrcpy-server-harmony
          python -c "import zipfile; p='src-tauri/resources/scrcpy-server-harmony'; z=zipfile.ZipFile(p); d=z.read('classes.dex'); assert b'CastPlusDisplay' in d; print('Harmony server verified:', len(d), 'DEX bytes')"

      - name: Apply customizations once
        shell: pwsh
        run: |
          python scripts/apply_fork_customizations.py
          python scripts/apply_app_picker_improvements.py
          python scripts/apply_app_names_orientation.py
          python scripts/apply_harmony_desktop.py
          python scripts/apply_harmony_latency_fix.py
          python scripts/apply_harmony_session_behavior.py
          python scripts/apply_light_ui.py
          python scripts/apply_light_ui_cleanup.py
          python scripts/apply_light_ui_fixes.py
          python scripts/apply_light_ui_dedup.py

      - name: Organize materialized source
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/build_harmony_server.ps1 <<'PS1'
          $ErrorActionPreference = "Stop"

          $root = Resolve-Path (Join-Path $PSScriptRoot "..")
          $work = Join-Path $env:TEMP "scrcpy-harmony-server-v4.1"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }

          git clone --depth 1 --branch v4.1 https://github.com/Genymobile/scrcpy.git $work

          $path = Join-Path $work "server/src/main/java/com/genymobile/scrcpy/video/NewDisplayCapture.java"
          $content = Get-Content -Raw $path
          $old = 'createNewVirtualDisplay("scrcpy", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          $new = 'createNewVirtualDisplay("CastPlusDisplay", displaySize.getWidth(), displaySize.getHeight(), dpi, surface, flags)'
          $count = ([regex]::Matches($content, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one patch target, found $count" }
          Set-Content -Path $path -Value ($content.Replace($old, $new)) -Encoding utf8 -NoNewline

          Push-Location $work
          .\gradlew.bat -p server assembleRelease --stacktrace
          Pop-Location

          $outDir = Join-Path $root "src-tauri/resources"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          $out = Join-Path $outDir "scrcpy-server-harmony"
          Copy-Item (Join-Path $work "server/build/outputs/apk/release/server-release-unsigned.apk") $out -Force
          python -c "import zipfile; p=r'$out'; z=zipfile.ZipFile(p); d=z.read('classes.dex'); assert b'CastPlusDisplay' in d; print('Harmony server verified:', len(d), 'DEX bytes')"
          Get-FileHash $out -Algorithm SHA256
          PS1

          if ! grep -q "## HarmonyOS PC Mode preview" README.md; then
          cat >> README.md <<'MD'

          ---

          ## HarmonyOS PC Mode preview

          This fork includes an experimental HarmonyOS/Huawei PC Mode path based on a modified scrcpy v4.1 server.

          - The Harmony virtual display is named `CastPlusDisplay`, which lets tested Huawei/HarmonyOS devices hand the display to the native PC projection framework.
          - Harmony mode uses UHID keyboard and mouse input, with a configurable scrcpy shortcut modifier for releasing mouse capture.
          - Resolution, DPI, FPS, bitrate, codec, audio, recording, fullscreen, always-on-top and screen-off settings are shared with normal sessions.
          - Harmony mode intentionally does not use the ordinary virtual-desktop 100 ms video buffer.
          - Normal sessions use the stock `scrcpy-server`; Harmony mode uses `scrcpy-server-harmony`.

          The modified server binary is not stored in git. Run `scripts/build_harmony_server.ps1` or use CI to build it reproducibly from official scrcpy v4.1 source.

          Tested with a Huawei/Honor device on HarmonyOS 4.2. This relies on internal platform behavior and may vary by firmware/device. It is not an official Huawei/Honor integration.
          MD
          fi

          cat > CHANGELOG.md <<'MD'
          # Changelog

          ## v4.1.0-harmony.1 — Preview

          - Experimental native HarmonyOS PC Mode through `CastPlusDisplay`.
          - Separate stock and Harmony scrcpy-server selection.
          - UHID keyboard/mouse defaults for Harmony mode.
          - Configurable scrcpy shortcut modifier for releasing UHID mouse capture.
          - Shared screen-off, audio, recording, fullscreen and other session behavior settings.
          - Low-latency Harmony rendering without the ordinary 100 ms virtual-desktop buffer.
          - Lightweight Windows-style UI.
          - Deduplicated advanced settings.
          - Fixed mouse-wheel/trackpad scrolling.
          - Materialized the previously generated customizations into normal repository source files.
          MD

          if ! grep -q "src-tauri/resources/scrcpy-server-harmony" .gitignore; then
            printf '\n# Built locally or in CI; do not commit generated Harmony server\nsrc-tauri/resources/scrcpy-server-harmony\n' >> .gitignore
          fi

          rm -f scripts/apply_*.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Build Windows bundles
        run: npm run tauri build

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src src-tauri scripts README.md CHANGELOG.md .gitignore
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: materialize HarmonyOS preview source [skip ci]"
          git push origin HEAD:release/harmony-preview

      - name: Upload verification build
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-materialized-source-verification
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/ScrcpyGUI.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
